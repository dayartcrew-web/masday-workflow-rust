# =============================================================================
# nginx.conf — Reverse proxy for masday-workflow multi-container stack
# Routes:
#   /           -> dashboard (Next.js, port 3000)
#   /api        -> api server (Hono, port 3000 on api container)
#   /health     -> returns 200 (nginx-level health check)
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Upstream: Dashboard (Next.js standalone)
    upstream dashboard {
        server dashboard:3000;
    }

    # Upstream: API (Hono HTTP)
    upstream api {
        server api:3000;
    }

    # Upstream: API WebSocket
    upstream api-ws {
        server api:3001;
    }

    server {
        listen 80;
        server_name _;

        # Nginx-level health check (lightweight, no backend proxy)
        location = /health {
            access_log off;
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }

        # API routes — proxy to Hono API server
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # WebSocket upgrade for API WS endpoint
        location /ws/ {
            proxy_pass         http://api-ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Dashboard routes — proxy to Next.js
        location / {
            proxy_pass         http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Next.js HMR support (for dev mode)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
