[package]
name = "masday-service"
version = "0.3.57"
edition = "2021"

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["serde", "v4"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
reqwest = { version = "0.12", features = ["json"] }
fastembed = { version = "5", default-features = false, features = ["hf-hub-native-tls", "image-models"], optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std"], optional = true }

[features]
default = ["local-embeddings"]
# Alias — enables local-embeddings-static (which pulls in fastembed + static ORT)
local-embeddings = ["local-embeddings-static"]
# Static link ONNX Runtime (default for Linux — downloads prebuilt binaries at compile time)
local-embeddings-static = ["fastembed", "fastembed/ort-download-binaries-native-tls"]
# Dynamic load ONNX Runtime at runtime (for Windows cross-compile)
# ONNX Runtime .dll/.so must be downloaded separately via `masday embed setup`.
# Build: cargo build --no-default-features --features local-embeddings-dynamic
local-embeddings-dynamic = ["fastembed", "fastembed/ort-load-dynamic", "ort/load-dynamic"]
# Legacy alias
ort-load-dynamic = ["local-embeddings-dynamic"]
