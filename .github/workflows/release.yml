# Release masday CLI binary
#
# Builds cross-platform release binaries and uploads to GitHub Releases.
# Triggers on tag push (v*) or manual workflow_dispatch.
# Repo stays PRIVATE — only the binary is published to releases.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: masday-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: masday-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: masday-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build -p masday-cli --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        run: strip target/${{ matrix.target }}/release/masday

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/masday ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum */masday-* > ../checksums-sha256.txt
          cat ../checksums-sha256.txt

      - name: Copy install script
        run: cp scripts/install-masday.sh install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Masday CLI ${{ steps.version.outputs.tag }}
          body: |
            ## Masday CLI ${{ steps.version.outputs.tag }}

            Self-contained binary with embedded templates (agents, skills, hooks).
            No source code required — just download and run.

            ### Install
            ```bash
            # One-line install (Linux/macOS)
            curl -fsSL https://github.com/dayartcrew-web/masday-workflow-rust/releases/download/${{ steps.version.outputs.tag }}/install.sh | bash
            ```

            ### Manual download
            ```bash
            # Linux
            curl -fsSL -o masday https://github.com/dayartcrew-web/masday-workflow-rust/releases/download/${{ steps.version.outputs.tag }}/masday-linux-x86_64
            chmod +x masday

            # macOS (Apple Silicon)
            curl -fsSL -o masday https://github.com/dayartcrew-web/masday-workflow-rust/releases/download/${{ steps.version.outputs.tag }}/masday-macos-aarch64
            chmod +x masday
            ```

            ### Usage
            ```
            masday quickstart                        # One-command setup (db + install + ready)
            masday install                           # Local mode (requires cargo)
            masday install --remote <url> --api-key <key>  # Remote mode
            masday --version
            ```

            ### Binary contents
            - 28 agent definitions (embedded)
            - 30+ skill definitions (embedded)
            - Global + project hooks (embedded)
            - MCP config generation (4 platforms)
          files: |
            artifacts/*/masday-*
            checksums-sha256.txt
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
