# Release masday CLI + MCP binaries
#
# Cross-platform release: Linux + macOS + Windows
# Builds masday CLI and masday-mcp standalone, then publishes to GitHub Releases.
#
# Triggers:
#   - Tag push (v*)
#   - Manual workflow_dispatch

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v0.4.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── masday CLI ──────────────────────────────────────
          # Linux x86_64 (with ONNX local embeddings)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            crate: masday-cli
            artifact: masday-linux-x86_64
            ext: ''
            features: '--features local-embeddings'
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            crate: masday-cli
            artifact: masday-macos-aarch64
            ext: ''
            features: '--no-default-features'
          # Windows x86_64 (no ONNX, remote provider only)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            crate: masday-cli
            artifact: masday-windows-x86_64
            ext: '.exe'
            features: '--no-default-features'

          # ── masday-mcp standalone ───────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            crate: masday-mcp
            artifact: masday-mcp-linux-x86_64
            ext: ''
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            crate: masday-mcp
            artifact: masday-mcp-macos-aarch64
            ext: ''
            features: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            crate: masday-mcp
            artifact: masday-mcp-windows-x86_64
            ext: '.exe'
            features: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Sync version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ inputs.version }}"
            TAG="${TAG#v}"
          fi
          echo "Setting version to $TAG"
          for toml in */Cargo.toml; do
            sed -i.bak "s/^version = \"[^\"]*\"/version = \"$TAG\"/" "$toml" && rm -f "${toml}.bak"
          done
          sed -i.bak "s/version = \"[0-9.]\+\"/version = \"$TAG\"/g" Cargo.toml && rm -f Cargo.toml.bak
        shell: bash

      - name: Build release binary
        run: |
          cargo build -p ${{ matrix.crate }} --release --target ${{ matrix.target }} ${{ matrix.features }}
        shell: bash

      - name: Strip binary (Unix only)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.crate == 'masday-cli' && 'masday' || 'masday-mcp' }}${{ matrix.ext }}
        shell: bash

      - name: Rename binary
        shell: bash
        run: |
          BINARY_NAME="${{ matrix.crate == 'masday-cli' && 'masday' || 'masday-mcp' }}"
          cp target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.ext }} ${{ matrix.artifact }}${{ matrix.ext }}
          chmod +x ${{ matrix.artifact }}${{ matrix.ext }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source (for install script + changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'masday-*' -o -name 'masday-*.exe' \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum masday-* > ../checksums-sha256.txt
          cp ../checksums-sha256.txt .
          echo "=== Checksums ==="
          cat checksums-sha256.txt
          echo "=== Files ==="
          ls -lh

      - name: Copy install script
        run: cp scripts/install-masday.sh release-assets/install.sh

      - name: Generate changelog from commits
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | grep -v "^${VERSION}$" | head -1)
          
          echo "Generating changelog: ${VERSION} since ${PREV_TAG}"
          
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"%s" 2>/dev/null || echo "")
          else
            COMMITS=$(git log -30 --pretty=format:"%s")
          fi
          
          ADDED=""
          FIXED=""
          CHANGED=""
          SECURITY=""
          
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            case "$commit" in
              feat:*|add:*|added:*)
                line=$(echo "$commit" | sed 's/^[^:]*://;s/^ *//')
                ADDED="${ADDED}- ${line}\n" ;;
              fix:*|fixed:*|bugfix:*)
                line=$(echo "$commit" | sed 's/^[^:]*://;s/^ *//')
                FIXED="${FIXED}- ${line}\n" ;;
              change:*|changed:*|refactor:*|update:*|release:*)
                line=$(echo "$commit" | sed 's/^[^:]*://;s/^ *//')
                CHANGED="${CHANGED}- ${line}\n" ;;
              security:*|sec:*)
                line=$(echo "$commit" | sed 's/^[^:]*://;s/^ *//')
                SECURITY="${SECURITY}- ${line}\n" ;;
              docs:*|doc:*) ;;
              *)
                case "$commit" in
                  *fix*|*bug*|*error*|*crash*)
                    FIXED="${FIXED}- ${commit}\n" ;;
                  *add*|*new*|*implement*|*support*)
                    ADDED="${ADDED}- ${commit}\n" ;;
                  *security*|*credential*|*secret*|*sanitize*)
                    SECURITY="${SECURITY}- ${commit}\n" ;;
                  *)
                    CHANGED="${CHANGED}- ${commit}\n" ;;
                esac
                ;;
            esac
          done <<< "$COMMITS"
          
          BODY=""
          if [ -n "$ADDED" ]; then BODY="${BODY}### Added\n${ADDED}\n"; fi
          if [ -n "$FIXED" ]; then BODY="${BODY}### Fixed\n${FIXED}\n"; fi
          if [ -n "$CHANGED" ]; then BODY="${BODY}### Changed\n${CHANGED}\n"; fi
          if [ -n "$SECURITY" ]; then BODY="${BODY}### Security\n${SECURITY}\n"; fi
          
          echo -e "$BODY" > /tmp/changelog.md
          
          DATE=$(date +%Y-%m-%d)
          ENTRY="## [${VERSION}] - ${DATE}\n\n${BODY}"
          
          if [ -f CHANGELOG.md ]; then
            if ! grep -q "\[${VERSION}\]" CHANGELOG.md; then
              HEADER_END=$(grep -n "^## \\[*" CHANGELOG.md | head -1 | cut -d: -f1)
              if [ -n "$HEADER_END" ]; then
                head -n $((HEADER_END - 1)) CHANGELOG.md > /tmp/cl_top.md
                tail -n +$HEADER_END CHANGELOG.md > /tmp/cl_bottom.md
                (cat /tmp/cl_top.md; echo -e "$ENTRY"; cat /tmp/cl_bottom.md) > CHANGELOG.md
              else
                echo -e "$ENTRY" >> CHANGELOG.md
              fi
            fi
          fi

      - name: Build release body
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          cat > /tmp/release_body.md << TEMPLATE
          ## Masday CLI ${VERSION}

          Self-contained binary with embedded agents, skills, and hooks.
          No source code required — just download and run.

          **Full Changelog**: https://github.com/dayartcrew-web/masday-workflow-rust/blob/master/CHANGELOG.md

          ---

          ### What's Changed

          TEMPLATE
          
          if [ -f /tmp/changelog.md ]; then
            cat /tmp/changelog.md >> /tmp/release_body.md
          else
            echo "See [CHANGELOG.md](https://github.com/dayartcrew-web/masday-workflow-rust/blob/master/CHANGELOG.md) for details." >> /tmp/release_body.md
          fi
          
          cat >> /tmp/release_body.md << 'FOOTER'

          ---

          ### Install (one-liner)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/dayartcrew-web/masday-workflow-rust/master/scripts/install-masday.sh | bash
          ```

          ### Manual download
          | Platform | CLI | MCP Server |
          |----------|-----|------------|
          | Linux x86_64 | `masday-linux-x86_64` | `masday-mcp-linux-x86_64` |
          | macOS Apple Silicon | `masday-macos-aarch64` | `masday-mcp-macos-aarch64` |
          | Windows x86_64 | `masday-windows-x86_64.exe` | `masday-mcp-windows-x86_64.exe` |

          ### Quick start
          ```
          masday quickstart                              # Interactive setup wizard
          masday install --remote <url> --api-key <key>  # Remote mode
          masday status                                  # Check system health
          ```

          ### Notes
          - **Linux**: Includes ONNX runtime for local embeddings
          - **macOS / Windows**: Uses remote embedding provider (Ollama or OpenAI)
          - **masday-mcp**: Standalone MCP server for lightweight deployments
          - Config stored at `~/.masday/config.toml`
          FOOTER

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Masday CLI ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_body.md
          files: |
            release-assets/masday-*
            release-assets/checksums-sha256.txt
            release-assets/install.sh
