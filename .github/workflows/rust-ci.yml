# Rust CI/CD Pipeline for masday-workflow-rust
#
# Runs: cargo test, clippy, rustfmt, cargo audit
# Triggers: push to main/*, pull requests, manual workflow_dispatch

name: Rust CI/CD

on:
  push:
    branches: [main, master, rust-*]
  pull_request:
    branches: [main, master, rust-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable default features (local-embeddings) to skip ort-sys/onnxruntime in CI
  CARGO_FLAGS: --no-default-features

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masday
          POSTGRES_PASSWORD: masday_dev_password
          POSTGRES_DB: masday
        ports:
          - 54331:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          # The ubuntu-latest runner image ships a Microsoft azure-cli apt source
          # (packages.microsoft.com) that intermittently returns HTTP 403, which
          # aborts `apt-get update` (exit 100) and fails CI before any test runs.
          # This job only needs `postgresql-client` from the Ubuntu archive, so
          # drop any apt source referencing packages.microsoft.com, then update
          # strictly (no `|| true`) so genuine archive errors still surface.
          sudo grep -rli 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run cargo check
        run: cargo check ${{ env.CARGO_FLAGS }} --all-targets

      - name: Run cargo test
        env:
          DATABASE_URL: postgresql://masday:masday_dev_password@localhost:54331/masday
        run: cargo test ${{ env.CARGO_FLAGS }} --all-targets

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://masday:masday_dev_password@localhost:54331/masday
        run: cargo test ${{ env.CARGO_FLAGS }} --test '*'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: |
          cargo clippy ${{ env.CARGO_FLAGS }} --all-targets -- -D warnings
          cargo clippy ${{ env.CARGO_FLAGS }} --all-targets --tests -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build debug
        run: cargo build ${{ env.CARGO_FLAGS }} --all-targets

      - name: Build release
        run: cargo build ${{ env.CARGO_FLAGS }} --all-targets --release

      - name: Check binary sizes
        run: |
          echo "Binary sizes (release):"
          ls -lh target/release/ | grep -E "(masday|agent)" || true

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build documentation
        run: cargo doc ${{ env.CARGO_FLAGS }} --no-deps

      - name: Check documentation links
        run: cargo doc ${{ env.CARGO_FLAGS }} --no-deps --document-private-items

  rpc-harness:
    name: RPC Harness
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build masday-mcp (stdio binary)
        # The stdio `masday-mcp` binary requires the `sqlite` feature (its
        # default). Do NOT pass --no-default-features here: that disables sqlite
        # and the binary is not built at all (only masday-mcp-http). masday-mcp
        # already pins masday-service to default-features=false, so enabling its
        # own sqlite default does not pull in ort-sys/onnxruntime.
        run: cargo build -p masday-mcp --release

      - name: Run MCP RPC harness
        # Exercises every MCP tool via stdin JSON-RPC, each in its own process
        # with its own timeout. Exits non-zero on RPC_ERROR/TIMEOUT/CRASH, or on
        # any MUST_OK tool returning a non-OK verdict. Runs in standalone SQLite
        # mode (no DATABASE_URL / PostgreSQL needed).
        env:
          MCP_BIN: target/release/masday-mcp
        run: bash tests/test-all-tools-rpc.sh

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test, clippy, format, audit, build, docs, rpc-harness]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Test: ${{ needs.test.result }}"
          echo "Clippy: ${{ needs.clippy.result }}"
          echo "Format: ${{ needs.format.result }}"
          echo "Audit: ${{ needs.audit.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Docs: ${{ needs.docs.result }}"
          echo "RPC harness: ${{ needs.rpc-harness.result }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi

          if [ "${{ needs.clippy.result }}" != "success" ]; then
            echo "::error::Clippy failed"
            exit 1
          fi

          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "::error::Format check failed"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed"
            exit 1
          fi

          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "::error::Security audit failed (cargo audit found vulnerabilities)"
            exit 1
          fi

          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::Docs build failed"
            exit 1
          fi

          if [ "${{ needs.rpc-harness.result }}" != "success" ]; then
            echo "::error::RPC harness failed (MCP tool smoke gate)"
            exit 1
          fi

          echo "All checks passed!"
