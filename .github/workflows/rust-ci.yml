# Rust CI/CD Pipeline for masday-workflow-rust
#
# Runs: cargo test, clippy, rustfmt, cargo audit
# Triggers: push to main/*, pull requests, manual workflow_dispatch

name: Rust CI/CD

on:
  push:
    branches: [main, master, rust-*]
  pull_request:
    branches: [main, master, rust-*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masday
          POSTGRES_PASSWORD: masday_dev_password
          POSTGRES_DB: masday
        ports:
          - 54331:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo test
        env:
          DATABASE_URL: postgresql://masday:masday_dev_password@localhost:54331/masday
        run: cargo test --all-targets

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://masday:masday_dev_password@localhost:54331/masday
        run: cargo test --test '*'
        continue-on-error: true

      - name: Run benchmarks
        env:
          DATABASE_URL: postgresql://masday:masday_dev_password@localhost:54331/masday
        run: cargo test --test benchmarks --release
        continue-on-error: true

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --tests -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build debug
        run: cargo build --all-targets

      - name: Build release
        run: cargo build --all-targets --release

      - name: Check binary sizes
        run: |
          echo "Binary sizes (release):"
          ls -lh target/release/ | grep -E "(masday|agent)" || true

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build documentation
        run: cargo doc --all-features --no-deps

      - name: Check documentation links
        run: cargo doc --all-features --no-deps --document-private-items

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test, clippy, format, audit, build, docs]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Test: ${{ needs.test.result }}"
          echo "Clippy: ${{ needs.clippy.result }}"
          echo "Format: ${{ needs.format.result }}"
          echo "Audit: ${{ needs.audit.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Docs: ${{ needs.docs.result }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi

          if [ "${{ needs.clippy.result }}" != "success" ]; then
            echo "::error::Clippy failed"
            exit 1
          fi

          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "::error::Format check failed"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build failed"
            exit 1
          fi

          echo "All checks passed!"
