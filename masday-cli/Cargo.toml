[package]
name = "masday-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "masday"
path = "src/main.rs"

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
masday-api = { path = "../masday-api" }
masday-mcp = { path = "../masday-mcp" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
include_dir = "0.7"
dirs = "5"
which = "6"
console = "0.15"
indicatif = "0.17"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tempfile = "3"
home = "0.5"
toml = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }
axum = "0.8"
inquire = "0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
