[package]
name = "masday-cli"
version = "0.3.73"
edition = "2021"

[[bin]]
name = "masday"
path = "src/main.rs"

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
masday-service = { path = "../masday-service", default-features = false }
masday-api = { path = "../masday-api", default-features = false }
masday-mcp = { path = "../masday-mcp" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
include_dir = "0.7"
dirs = "5"
which = "6"
console = "0.15"
indicatif = "0.17"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tempfile = "3"
home = "0.5"
toml = "0.8"
walkdir = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rusqlite = "0.32"
axum = "0.8"
inquire = "0.7"
zip = "2"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[features]
default = ["local-embeddings"]
local-embeddings = ["masday-api/local-embeddings"]
# Dynamic load ONNX Runtime — for Windows cross-compile
# Build: cargo build -p masday-cli --no-default-features --features local-embeddings-dynamic --target x86_64-pc-windows-gnu
local-embeddings-dynamic = ["masday-api/local-embeddings-dynamic"]
ort-load-dynamic = ["local-embeddings-dynamic"]
# Development mode — enables local build from source (cargo build, Local install mode)
# Release builds should NOT include this feature.
