<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masday</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b0d12;
        color: #e5e7eb;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .card { max-width: 480px; padding: 2.5rem; text-align: center; }
      h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
      p { color: #9ca3af; line-height: 1.55; font-size: .95rem; margin: .5rem 0; }
      code {
        background: #1a1d27;
        padding: .12rem .4rem;
        border-radius: 5px;
        font-size: .85rem;
        color: #c4b5fd;
      }
      .muted { margin-top: 1.75rem; font-size: .8rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>⚡ Masday</h1>
      <p>The web dashboard is not bundled in this build.</p>
      <p>To run the dashboard locally:</p>
      <p><code>cd apps/dashboard &amp;&amp; pnpm dev</code></p>
      <p class="muted">
        The API (<code>/api</code>) and MCP (<code>/mcp</code>) endpoints on this
        server remain available. See <code>apps/dashboard</code>.
      </p>
    </div>
  </body>
</html>
