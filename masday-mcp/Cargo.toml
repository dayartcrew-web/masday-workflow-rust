[package]
name = "masday-mcp"
version = "0.3.68"
edition = "2021"

[[bin]]
name = "masday-mcp"
path = "src/bin/stdio.rs"
required-features = ["sqlite"]

[[bin]]
name = "masday-mcp-http"
path = "src/bin/http.rs"

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
masday-service = { path = "../masday-service", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
percent-encoding = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"], optional = true }
once_cell = "1"
home = "0.5"

[dev-dependencies]
tempfile = "3"
