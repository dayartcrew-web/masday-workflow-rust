[package]
name = "masday-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "masday-mcp-http"
path = "src/bin/http.rs"

[[bin]]
name = "masday-mcp-stdio"
path = "src/bin/stdio.rs"

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
masday-service = { path = "../masday-service", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
