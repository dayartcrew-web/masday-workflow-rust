[package]
name = "masday-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "masday-mcp"
path = "src/main.rs"

[dependencies]
masday-core = { path = "../masday-core" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
