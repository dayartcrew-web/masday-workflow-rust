[package]
name = "masday-db"
version = "0.3.72"
edition = "2021"

[dependencies]
masday-core = { path = "../masday-core" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
deadpool = { version = "0.12", features = ["rt_tokio_1"] }
deadpool-postgres = { version = "0.14", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "array-impls"] }
pgvector = { version = "0.4", features = ["postgres"] }
