[package]
name = "masday-api"
version = "0.3.13"
edition = "2021"

[dependencies]
masday-core = { path = "../masday-core" }
masday-db = { path = "../masday-db" }
masday-service = { path = "../masday-service", default-features = false }
pgvector = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
uuid = { version = "1.0", features = ["serde"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_html_form = "0.2"

[features]
default = ["local-embeddings"]
local-embeddings = ["masday-service/local-embeddings"]
local-embeddings-dynamic = ["masday-service/local-embeddings-dynamic"]
ort-load-dynamic = ["local-embeddings-dynamic"]
